<script>
    function submitAddUser(e) {
        e.preventDefault();
        showLoading();
        const data = {
            email: document.getElementById('addEmail').value,
            nama: document.getElementById('addNama').value,
            role: document.getElementById('addRole').value,
            bidang: document.getElementById('addBidang').value
        };
        google.script.run
            .withSuccessHandler(function() { location.reload(); })
            .withFailureHandler(function(err) { hideLoading(); alert(err.message); })
            .apiAddUser(data);
    }

    function editUser(email, nama, role, bidang, aktif) {
        document.getElementById('editTargetEmail').value = email;
        document.getElementById('editEmail').value = email;
        document.getElementById('editNama').value = nama;
        document.getElementById('editRole').value = role;
        document.getElementById('editBidang').value = bidang;
        document.getElementById('editAktif').checked = aktif;
        new bootstrap.Modal(document.getElementById('modalEditUser')).show();
    }

    function submitEditUser(e) {
        e.preventDefault();
        showLoading();
        const targetEmail = document.getElementById('editTargetEmail').value;
        const data = {
            nama: document.getElementById('editNama').value,
            role: document.getElementById('editRole').value,
            bidang: document.getElementById('editBidang').value,
            aktif: document.getElementById('editAktif').checked
        };
        google.script.run
            .withSuccessHandler(function() { location.reload(); })
            .withFailureHandler(function(err) { hideLoading(); alert(err.message); })
            .apiUpdateUser(targetEmail, data);
    }

    function deleteUser(email) {
        if (!confirm('Apakah Anda yakin ingin menghapus user ' + email + '?')) return;
        showLoading();
        google.script.run
            .withSuccessHandler(function() { location.reload(); })
            .withFailureHandler(function(err) { hideLoading(); alert(err.message); })
            .apiDeleteUser(email);
    }
</script>
